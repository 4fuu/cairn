[package]
name = "cairn"
version = "2026.1127.1"
edition = "2021"
rust-version = "1.89"
description = "A local, read-only index of coding-agent sessions, queried through a CLI and a skill."
license = "MIT"
repository = "https://github.com/4fuu/cairn"
readme = "README.md"
publish = false
keywords = ["ai", "agent", "cli", "search", "sqlite"]
categories = ["command-line-utilities", "development-tools"]


[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.10", features = ["derive"] }
dirs = "7.0.0"
jieba-rs = "0.11.0"
rayon = "1.12.0"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled", "functions", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
walkdir = "2.5.1"
zstd = "0.14.5"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
